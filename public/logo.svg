<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8"/>

  <!-- Glowing Flow Arc -->
  <path d="M 120 380 C 180 430, 340 430, 400 350" fill="none" stroke="url(#iconGrad)" stroke-width="16" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>

  <g transform="translate(116, 100)">
    <!-- Building 1 (Left / Shorter) -->
    <rect x="40" y="120" width="80" height="180" rx="12" fill="url(#iconGrad)" opacity="0.85"/>
    <circle cx="80" cy="160" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="80" cy="200" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="80" cy="240" r="8" fill="#FFFFFF" opacity="0.9"/>

    <!-- Building 2 (Center / Main Enterprise Tower) -->
    <rect x="140" y="40" width="100" height="260" rx="16" fill="url(#iconGrad)" filter="url(#glow)"/>
    <!-- Windows -->
    <rect x="165" y="80" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="197" y="80" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="165" y="120" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="197" y="120" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="165" y="160" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="197" y="160" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="165" y="200" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="197" y="200" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/>

    <!-- Dynamic Flowing Arrow/Swoosh (FacilityFlow Theme) -->
    <path d="M 20 260 C 100 320, 220 320, 270 230" fill="none" stroke="#06B6D4" stroke-width="18" stroke-linecap="round"/>
    <polygon points="275,215 285,245 250,240" fill="#06B6D4"/>
  </g>
</svg>
